[package]
name = "boop-gtk"
build = "build.rs"
version = "1.9.1"
authors = ["Zoey Sheffield", "Harsh Shandilya <me@msfjarvis.dev>"]
edition = "2018"
description = """A scriptable scratchpad for developers

Port of @IvanMathy's Boop to GTK
"""
license = "MIT"
homepage = "https://boop-gtk.zoey.fyi"
repository = "https://github.com/zoeyfyi/boop-gtk/"
keywords = ["gtk", "text-editor", "editor", "linux", "javascript"]
categories = ["text-editors"]
publish = false

[profile.dev]
lto = "off"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# GTK
glib = "0.18"
gdk-pixbuf = "0.18"
pango = "0.18"
sourceview5 = { version = "0.10", features = ["v5_6"] }
# GTK utils
shrinkwraprs = "0.3.0"
# JSON
serde = { version = "1.0.200", features = ["derive"] }
serde_jsonrc = "0.1"
toml = "0.9.0"
# Logging
log = "0.4.21"
env_logger = "0.11.3"
# Fuzzy search
fuse-rust = "0.4.0"
# File system
open = "5.3.1"
xdg = "3.0.0"
notify = "8.0.0"
config = "0.15"
once_cell = "1.19.0"
rust-embed = { version = "8.3.0", features = ["debug-embed"] }
dirty2 = "0.1.0"
eyre = "0.6.12"
color-eyre = "0.6.3"
crossbeam = "0.8.4"
fs_extra = "1.3.0"
v8 = "130.0.2"

[dependencies.gtk4]
version = "0.10"
features = ["v4_4"]

[dependencies.gio]
version = "0.18"
features = ["v2_66"]

[dev-dependencies]
tempfile = "3.10.1"
directories = "6.0.0" # TODO: remove

[build-dependencies]
fs_extra = "1.3.0"
